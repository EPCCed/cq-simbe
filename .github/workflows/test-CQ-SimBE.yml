name: Build and test CQ-SimBE

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check environment policy
        run: nix build .#checks.x86_64-linux.environment-policy --no-link --no-update-lock-file
      - name: Build and test Debug and Release
        run: |
          nix develop .#${{ matrix.shell }} --no-update-lock-file --max-jobs 2 --cores 2 --command bash -euc '
            for preset in debug release; do
              cmake --preset "$preset"
              cmake --build --preset "$preset" --parallel 2
              ctest --preset "$preset" --output-on-failure
            done
            cmake -DSOURCE_DIR="$PWD" -DBINARY_DIR="$PWD/out/package-check" -P tests/packaging/check-package.cmake
          '
  static-quest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Validate shared and static CQ-SimBE against static QuEST
        run: |
          nix develop .#static-quest --no-update-lock-file --max-jobs 2 --cores 2 --command bash -euc '
            cmake -DSOURCE_DIR="$PWD" -DBINARY_DIR="$PWD/out/package-check" -P tests/packaging/check-package.cmake
          '
  non-mpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build and test without MPI
        run: |
          nix develop .#non-mpi --no-update-lock-file --max-jobs 2 --cores 2 --command bash -euc '
            cmake --preset debug
            cmake --build --preset debug --parallel 2
            ctest --preset debug --output-on-failure
            cmake -DSOURCE_DIR="$PWD" -DBINARY_DIR="$PWD/out/package-check" -P tests/packaging/check-package.cmake
          '
